# This is a Declarative Automation Bundle definition for project_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_dab
  uuid: da7305bd-b067-4073-adcc-9d31b45e93f9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405608814208629.9.azuredatabricks.net
    variables:
      catalog: dab_dbx
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405608814208629.9.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ratneshgautam7@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ratneshgautam7@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_dbx
      schema: prod
    permissions:
      - user_name: ratneshgautam7@gmail.com
        level: CAN_MANAGE
