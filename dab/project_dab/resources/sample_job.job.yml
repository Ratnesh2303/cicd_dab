# A sample job for project_dab.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb
          #job_cluster_key: job_cluster
          environment_key: default
        - task_key: notebook_task_2
          depends_on:
            - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/notebook2.ipynb
          #job_cluster_key: job_cluster
          environment_key: default
        - task_key: notebook_task_3
          depends_on:
            - task_key: notebook_task
            - task_key: notebook_task_2
          run_if :
            -condition : AT_LEAST_ONE_TASK_SUCCEEDED
          notebook_task:
            notebook_path: ../src/notebook3.ipynb
          #job_cluster_key: job_cluster
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      # job_clusters:
